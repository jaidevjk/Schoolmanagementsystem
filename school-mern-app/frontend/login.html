<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | V Blooms D World School</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-hover: #79b8ff;
      --danger: #f85149;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      --font-sans: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: #0d1117;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    .login-brand h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .login-brand p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: #0d1117;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .login-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="logo">VB</div>
      <h1>V Blooms D World School</h1>
      <p>Portal Login — Admin, Teacher & Student</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@school.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <button type="submit" class="btn" id="loginBtn">Sign in</button>
    </form>

    <p class="login-hint">
      Demo: admin@school.com / admin123 · teacher1@school.com / teacher123 · student1@school.com / student123
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.innerText = '';
      if (!email || !password) { errorMsg.innerText = "Please fill in all fields."; return; }

      btn.innerText = 'Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch("http://localhost:5001/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("role", data.user.role);
          localStorage.setItem("name", data.user.name);
          localStorage.setItem("userId", data.user._id);

          const role = data.user.role.toLowerCase();
          if (role === "admin") window.location.href = "admin-dashboard.html";
          else if (role === "teacher") window.location.href = "teacher-dashboard.html"; // Will create this
          else window.location.href = "student-dashboard.html"; // Will create this
        } else {
          errorMsg.innerText = data.message || "Login failed.";
        }
      } catch (err) {
        console.error(err);
        errorMsg.innerText = "Server error. Is the backend running on port 5001?";
      } finally {
        btn.innerText = 'Sign in';
        btn.disabled = false;
      }
    });
  </script>

</body>

</html>
